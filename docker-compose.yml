services:
  # ============================================================================
  # 1. PostgreSQL Database (Airflow Metadata + Lakehouse Curated Layer)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sismowatch_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_master_secret_2026}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sismowatch"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sismowatch-net

  # ============================================================================
  # 2. MinIO Object Storage (Data Lakehouse S3: Bronze, Silver, Gold Parquet)
  # ============================================================================
  minio:
    image: pgsty/silo:latest
    container_name: sismowatch_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sismowatch_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sismowatch_secret_minio_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - sismowatch-net

  # Provisioner One-Shot to create the Lakehouse Bucket
  minio-init:
    image: pgsty/silo:latest
    container_name: sismowatch_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set sismo http://minio:9000 ${MINIO_ROOT_USER:-sismowatch_admin} ${MINIO_ROOT_PASSWORD:-sismowatch_secret_minio_2026};
      mc mb --ignore-existing sismo/${MINIO_BUCKET:-sismowatch-lake};
      exit 0;
      "
    networks:
      - sismowatch-net

  # ============================================================================
  # 3. Apache Airflow (Orquestador Maestro con PySpark y OpenLineage)
  # ============================================================================
  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.2-python3.11}
    container_name: sismowatch_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_secret_2026}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-SismoAirflowAdmin2026!}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --firstname "Daniel" \
          --lastname "Echeverria" \
          --role "Admin" \
          --email "${ADMIN_EMAIL:-admin@sismowatch.internal}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-SismoAirflowAdmin2026!}" || true
    networks:
      - sismowatch-net

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.2-python3.11}
    container_name: sismowatch_airflow_webserver
    restart: always
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_secret_2026}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${JWT_SECRET_KEY}
      AIRFLOW__WEBSERVER__WORKERS: "2"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-boto3 psycopg2-binary requests pandas pyarrow pandera pydantic openlineage-airflow}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/include:/opt/airflow/include
      - ./airflow/include:/home/airflow/.local/lib/python3.11/site-packages/airflow/include
      - ./airflow/logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - sismowatch-net

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.2-python3.11}
    container_name: sismowatch_airflow_scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_secret_2026}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-boto3 psycopg2-binary requests pandas pyarrow pandera pydantic openlineage-airflow}
      # S3 / MinIO Configuration for PySpark tasks
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-sismowatch_admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-sismowatch_secret_minio_2026}
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/include:/opt/airflow/include
      - ./airflow/include:/home/airflow/.local/lib/python3.11/site-packages/airflow/include
      - ./airflow/logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - sismowatch-net

  # ============================================================================
  # 4. OpenMetadata Governance Viewer (Puerto Oficial 8585:8585)
  # ============================================================================
  openmetadata-viewer:
    build:
      context: ./openmetadata-viewer
      dockerfile: Dockerfile
    container_name: sismowatch_openmetadata_viewer
    restart: always
    environment:
      OPENMETADATA_PORT: 8585
    ports:
      - "8585:8585"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - sismowatch-net

  # ============================================================================
  # 5. FastAPI Backend Platform (REST, JWT RBAC, SSE, Chatbot & OpenLineage)
  # ============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sismowatch_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: http://host.docker.internal:11435
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - sismowatch-net

  # ============================================================================
  # 6. React JS Frontend Platform (Vite + Tailwind Dark Mode + Chart.js)
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sismowatch_web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_OPENMETADATA_URL: http://localhost:8585
      VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-cb1_4vzx_1_c2e8d37b1e85e3709ad52c32}
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - sismowatch-net

# ==============================================================================
# Persistent Volumes & Network Definition
# ==============================================================================
volumes:
  postgres_data:
  minio_data:

networks:
  sismowatch-net:
    driver: bridge
